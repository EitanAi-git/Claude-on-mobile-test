<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cookie Clicker</title>
  <style>
    :root {
      --bg1: #1a0f0a;
      --bg2: #3b2314;
      --panel: rgba(255, 240, 220, 0.07);
      --panel-border: rgba(255, 220, 180, 0.15);
      --gold: #ffcc4d;
      --accent: #ff8a3d;
      --good: #6ee7a8;
      --text: #fff6ec;
      --muted: rgba(255, 246, 236, 0.6);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg1);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) 16px 32px;
    }

    @media (min-width: 820px) {
      .layout { grid-template-columns: 1.1fr 1fr; align-items: start; }
      .cookie-area { position: sticky; top: 16px; }
    }

    /* ---------- Cookie area ---------- */
    .cookie-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
      user-select: none;
    }

    .bakery-name {
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #count {
      font-size: clamp(2rem, 9vw, 3.2rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 4px 20px rgba(255, 204, 77, 0.35);
    }

    #cps { color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; }

    .cookie-wrap {
      position: relative;
      width: min(68vw, 280px);
      aspect-ratio: 1;
      margin: 12px 0;
    }

    .cookie-wrap::before {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 204, 77, 0.35), transparent 65%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.7; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    #cookie {
      position: relative;
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.5));
    }

    #cookie:hover { transform: scale(1.03); }
    #cookie:active { transform: scale(0.94); }
    #cookie:focus-visible { outline: 3px solid var(--gold); outline-offset: 8px; border-radius: 50%; }
    #cookie svg { width: 100%; height: 100%; display: block; }

    .float-num {
      position: fixed;
      z-index: 6;
      font-weight: 900;
      font-size: 1.3rem;
      color: white;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      animation: floatUp 1s ease-out forwards;
    }

    @keyframes floatUp {
      to { transform: translateY(-80px); opacity: 0; }
    }

    #news {
      min-height: 2.6em;
      max-width: 420px;
      font-size: 0.9rem;
      color: var(--muted);
      font-style: italic;
    }

    .row-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

    .small-btn {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .small-btn:hover { background: rgba(255, 240, 220, 0.14); }

    /* ---------- Shop ---------- */
    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .panel h2 {
      margin: 0 0 10px;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shop { display: flex; flex-direction: column; gap: 16px; }

    #upgrades {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 52px;
    }

    #upgrades:empty::after {
      content: "Keep baking to unlock upgrades…";
      color: var(--muted);
      font-size: 0.85rem;
      align-self: center;
    }

    .upgrade {
      width: 52px;
      height: 52px;
      font-size: 1.6rem;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 204, 77, 0.12);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }

    .upgrade:hover:not(:disabled) { transform: translateY(-2px); }
    .upgrade:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); }

    .building {
      display: grid;
      grid-template-columns: 48px 1fr auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: rgba(255, 240, 220, 0.05);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .building:last-child { margin-bottom: 0; }
    .building:hover:not(:disabled) { background: rgba(255, 240, 220, 0.12); }
    .building:active:not(:disabled) { transform: scale(0.98); }
    .building:disabled { opacity: 0.45; cursor: not-allowed; }
    .building.locked .b-name { filter: blur(4px); }

    .b-icon { font-size: 2rem; text-align: center; }
    .b-name { font-weight: 800; font-size: 1.05rem; }
    .b-info { font-size: 0.8rem; color: var(--muted); }
    .b-cost { font-size: 0.85rem; color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
    .building:disabled .b-cost { color: #ff7b7b; }
    .b-owned { font-size: 1.8rem; font-weight: 900; opacity: 0.35; font-variant-numeric: tabular-nums; }

    .buy-amount { display: flex; gap: 4px; }
    .buy-amount button {
      background: none;
      border: 1px solid var(--panel-border);
      color: var(--muted);
      border-radius: 8px;
      padding: 2px 8px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .buy-amount button.active { background: var(--gold); color: #3b2314; border-color: var(--gold); font-weight: 800; }

    /* ---------- Golden cookie ---------- */
    #golden {
      position: fixed;
      z-index: 7;
      width: 72px;
      height: 72px;
      border: none;
      background: none;
      padding: 0;
      cursor: pointer;
      display: none;
      animation: goldSpin 4s linear infinite, goldFade 12s linear forwards;
      filter: drop-shadow(0 0 16px var(--gold));
    }

    #golden svg { width: 100%; height: 100%; }

    @keyframes goldSpin { to { transform: rotate(360deg); } }
    @keyframes goldFade { 0% { opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

    #buff {
      display: none;
      background: linear-gradient(90deg, #ffcc4d, #ff8a3d);
      color: #3b2314;
      font-weight: 900;
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 0.85rem;
    }

    /* ---------- Toasts ---------- */
    #toasts {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      width: calc(100% - 32px);
      max-width: 380px;
      pointer-events: none;
    }

    .toast {
      background: rgba(40, 24, 14, 0.95);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: 10px 16px;
      font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      animation: toastIn 0.3s ease-out, toastOut 0.4s ease-in 3.2s forwards;
      width: 100%;
    }

    .toast b { color: var(--gold); }

    @keyframes toastIn { from { transform: translateY(20px); opacity: 0; } }
    @keyframes toastOut { to { transform: translateY(20px); opacity: 0; } }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 12px;
      font-size: 0.85rem;
    }
    .stats-grid span:nth-child(odd) { color: var(--muted); }
    .stats-grid span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }

    .ach-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .ach {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      font-size: 1.2rem;
      border-radius: 10px;
      background: rgba(255, 240, 220, 0.05);
      border: 1px solid var(--panel-border);
      filter: grayscale(1);
      opacity: 0.35;
    }
    .ach.got { filter: none; opacity: 1; background: rgba(255, 204, 77, 0.15); border-color: var(--gold); }

    @media (prefers-reduced-motion: reduce) {
      .cookie-wrap::before, #golden { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx"></canvas>

  <div class="layout">
    <section class="cookie-area">
      <div class="bakery-name">Your Bakery</div>
      <div id="count">0 cookies</div>
      <div id="cps">per second: 0</div>
      <div id="buff"></div>

      <div class="cookie-wrap">
        <button id="cookie" aria-label="Click the cookie">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <radialGradient id="dough" cx="40%" cy="35%" r="70%">
                <stop offset="0%" stop-color="#f2c27b"/>
                <stop offset="60%" stop-color="#d99a4e"/>
                <stop offset="100%" stop-color="#a8682b"/>
              </radialGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#dough)" stroke="#8a5220" stroke-width="4"/>
            <g fill="#4a2a12">
              <ellipse cx="65" cy="60" rx="11" ry="9" transform="rotate(20 65 60)"/>
              <ellipse cx="120" cy="50" rx="9" ry="7"/>
              <ellipse cx="145" cy="95" rx="12" ry="9" transform="rotate(-30 145 95)"/>
              <ellipse cx="95" cy="100" rx="10" ry="8" transform="rotate(45 95 100)"/>
              <ellipse cx="55" cy="115" rx="9" ry="7"/>
              <ellipse cx="110" cy="145" rx="12" ry="8" transform="rotate(10 110 145)"/>
              <ellipse cx="70" cy="155" rx="7" ry="6"/>
              <ellipse cx="150" cy="140" rx="8" ry="6"/>
              <ellipse cx="85" cy="35" rx="6" ry="5"/>
            </g>
            <g fill="#ffe2b0" opacity="0.35">
              <circle cx="60" cy="45" r="14"/>
            </g>
          </svg>
        </button>
      </div>

      <div id="news">Welcome to your bakery. Click the cookie to start!</div>

      <div class="row-btns">
        <button class="small-btn" id="soundToggle">🔊 Sound</button>
        <button class="small-btn" id="resetBtn">🗑️ Reset</button>
      </div>
    </section>

    <section class="shop">
      <div class="panel">
        <h2>Upgrades</h2>
        <div id="upgrades"></div>
      </div>

      <div class="panel">
        <h2>
          <span>Buildings</span>
          <span class="buy-amount" id="buyAmount">
            <button data-n="1" class="active">x1</button>
            <button data-n="10">x10</button>
            <button data-n="100">x100</button>
          </span>
        </h2>
        <div id="buildings"></div>
      </div>

      <div class="panel">
        <h2>Stats &amp; Achievements</h2>
        <div class="stats-grid" id="stats"></div>
        <div class="ach-list" id="achievements"></div>
      </div>
    </section>
  </div>

  <button id="golden" aria-label="Golden cookie">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="#ffcc4d" stroke="#e09b1a" stroke-width="8"/>
      <g fill="#e09b1a">
        <circle cx="65" cy="65" r="10"/><circle cx="130" cy="60" r="9"/>
        <circle cx="100" cy="105" r="11"/><circle cx="60" cy="130" r="9"/>
        <circle cx="140" cy="135" r="10"/>
      </g>
    </svg>
  </button>

  <div id="toasts"></div>

  <script>
    // ================= Game data =================
    const BUILDINGS = [
      { id: "cursor",  name: "Cursor",       icon: "👆", base: 15,          cps: 0.1,    desc: "Clicks the cookie for you." },
      { id: "grandma", name: "Grandma",      icon: "👵", base: 100,         cps: 1,      desc: "A nice grandma to bake more cookies." },
      { id: "farm",    name: "Farm",         icon: "🌾", base: 1100,        cps: 8,      desc: "Grows cookie plants from cookie seeds." },
      { id: "mine",    name: "Mine",         icon: "⛏️", base: 12000,       cps: 47,     desc: "Mines out cookie dough and chocolate chips." },
      { id: "factory", name: "Factory",      icon: "🏭", base: 130000,      cps: 260,    desc: "Produces large quantities of cookies." },
      { id: "bank",    name: "Bank",         icon: "🏦", base: 1400000,     cps: 1400,   desc: "Generates cookies from interest." },
      { id: "temple",  name: "Temple",       icon: "🛕", base: 20000000,    cps: 7800,   desc: "Full of precious, ancient chocolate." },
      { id: "rocket",  name: "Rocket",       icon: "🚀", base: 330000000,   cps: 44000,  desc: "Brings cookies from the cookie planet." },
      { id: "portal",  name: "Portal",       icon: "🌀", base: 5100000000,  cps: 260000, desc: "Opens a door to the Cookieverse." },
    ];

    // Upgrades: unlock when a condition is met, then can be bought once.
    const UPGRADES = [
      { id: "click1", icon: "🖱️", name: "Reinforced Finger",  cost: 100,      desc: "Clicking is twice as strong.",           unlock: s => s.totalClicks >= 15,             apply: e => e.clickMult *= 2 },
      { id: "click2", icon: "💪", name: "Strong Arm",         cost: 5000,     desc: "Clicking is twice as strong.",           unlock: s => s.totalClicks >= 200,            apply: e => e.clickMult *= 2 },
      { id: "click3", icon: "⚡", name: "Lightning Tap",      cost: 100000,   desc: "Clicks also earn 1% of your cookies/sec.", unlock: s => s.totalClicks >= 1000,         apply: e => e.clickCpsPct += 0.01 },
      { id: "cur1",   icon: "👆", name: "Ambidextrous",       cost: 500,      desc: "Cursors are twice as efficient.",        unlock: s => owned(s, "cursor") >= 1,        apply: e => e.mult.cursor *= 2 },
      { id: "cur2",   icon: "🖐️", name: "Thousand Fingers",   cost: 10000,    desc: "Cursors are twice as efficient.",        unlock: s => owned(s, "cursor") >= 10,       apply: e => e.mult.cursor *= 2 },
      { id: "gran1",  icon: "🧓", name: "Forwards from Grandma", cost: 1000,  desc: "Grandmas are twice as efficient.",       unlock: s => owned(s, "grandma") >= 1,       apply: e => e.mult.grandma *= 2 },
      { id: "gran2",  icon: "🍪", name: "Steel Rolling Pins", cost: 50000,    desc: "Grandmas are twice as efficient.",       unlock: s => owned(s, "grandma") >= 10,      apply: e => e.mult.grandma *= 2 },
      { id: "farm1",  icon: "🌱", name: "Cheap Hoes",         cost: 11000,    desc: "Farms are twice as efficient.",          unlock: s => owned(s, "farm") >= 1,          apply: e => e.mult.farm *= 2 },
      { id: "mine1",  icon: "💎", name: "Sugar Gas",          cost: 120000,   desc: "Mines are twice as efficient.",          unlock: s => owned(s, "mine") >= 1,          apply: e => e.mult.mine *= 2 },
      { id: "fac1",   icon: "⚙️", name: "Sturdier Belts",     cost: 1300000,  desc: "Factories are twice as efficient.",      unlock: s => owned(s, "factory") >= 1,       apply: e => e.mult.factory *= 2 },
      { id: "bank1",  icon: "💳", name: "Cookie Credit Cards", cost: 14000000, desc: "Banks are twice as efficient.",         unlock: s => owned(s, "bank") >= 1,          apply: e => e.mult.bank *= 2 },
      { id: "all1",   icon: "🍫", name: "Extra Chocolate",    cost: 1000000,  desc: "All production +10%.",                   unlock: s => s.totalBaked >= 500000,         apply: e => e.globalMult *= 1.1 },
      { id: "all2",   icon: "🥛", name: "Cookie Milk",        cost: 50000000, desc: "All production +25%.",                   unlock: s => s.totalBaked >= 20000000,       apply: e => e.globalMult *= 1.25 },
      { id: "lucky",  icon: "🍀", name: "Lucky Day",          cost: 77777,    desc: "Golden cookies appear twice as often.",  unlock: s => s.goldenClicks >= 3,            apply: e => e.goldenRate *= 2 },
    ];

    const ACHIEVEMENTS = [
      { id: "c1",    icon: "🍪", name: "Wake and Bake",     desc: "Bake 1 cookie.",                   test: s => s.totalBaked >= 1 },
      { id: "c1k",   icon: "🥠", name: "Making Some Dough", desc: "Bake 1,000 cookies.",              test: s => s.totalBaked >= 1000 },
      { id: "c100k", icon: "🎂", name: "So Baked Right Now", desc: "Bake 100,000 cookies.",           test: s => s.totalBaked >= 100000 },
      { id: "c10m",  icon: "🏰", name: "Cookie Empire",     desc: "Bake 10 million cookies.",         test: s => s.totalBaked >= 1e7 },
      { id: "c1b",   icon: "🌌", name: "Cookie Galaxy",     desc: "Bake 1 billion cookies.",          test: s => s.totalBaked >= 1e9 },
      { id: "clk100",icon: "👉", name: "Clicktastic",       desc: "Click 100 times.",                 test: s => s.totalClicks >= 100 },
      { id: "clk1k", icon: "🔥", name: "Clickathlon",       desc: "Click 1,000 times.",               test: s => s.totalClicks >= 1000 },
      { id: "cps10", icon: "⏱️", name: "Casual Baking",     desc: "Reach 10 cookies per second.",     test: s => cpsNow >= 10 },
      { id: "cps1k", icon: "🏎️", name: "Hardcore Baking",   desc: "Reach 1,000 cookies per second.",  test: s => cpsNow >= 1000 },
      { id: "gran",  icon: "👵", name: "Grandma's Cookies", desc: "Own 10 grandmas.",                 test: s => owned(s, "grandma") >= 10 },
      { id: "gold1", icon: "✨", name: "Golden Touch",      desc: "Click a golden cookie.",           test: s => s.goldenClicks >= 1 },
      { id: "all",   icon: "🏆", name: "Collector",         desc: "Own at least 1 of every building.", test: s => BUILDINGS.every(b => owned(s, b.id) >= 1) },
    ];

    const NEWS = [
      "News: local bakery smells suspiciously amazing.",
      "News: scientists confirm cookies are 'pretty good'.",
      "News: grandmas report record levels of baking.",
      "News: cookie prices skyrocket; milk sales soar.",
      "News: man tries to eat just one cookie, fails.",
      "News: experts warn of global cookie surplus. Nobody complains.",
      "News: cookie farm spotted from space.",
      "News: 'I just wanted to bake a little,' says local tycoon.",
      "News: cookie-shaped crop circles appear overnight.",
      "News: portal to the Cookieverse 'mostly safe,' says nobody.",
    ];

    // ================= State =================
    const SAVE_KEY = "cookieClickerSave.v1";

    function freshState() {
      return {
        cookies: 0,
        totalBaked: 0,
        totalClicks: 0,
        goldenClicks: 0,
        buildings: {},
        upgrades: [],
        achievements: [],
        startedAt: Date.now(),
        lastSaved: Date.now(),
      };
    }

    let state = freshState();
    let effects;       // derived from upgrades
    let cpsNow = 0;
    let buyAmount = 1;
    let soundOn = true;
    let buffUntil = 0;
    let buffMult = 1;
    let buffName = "";

    function owned(s, id) { return s.buildings[id] || 0; }

    function computeEffects() {
      const e = { clickMult: 1, clickCpsPct: 0, globalMult: 1, goldenRate: 1, mult: {} };
      for (const b of BUILDINGS) e.mult[b.id] = 1;
      for (const u of UPGRADES) if (state.upgrades.includes(u.id)) u.apply(e);
      effects = e;
    }

    function buildingCps(b) {
      return b.cps * owned(state, b.id) * effects.mult[b.id];
    }

    function baseCps() {
      return BUILDINGS.reduce((sum, b) => sum + buildingCps(b), 0) * effects.globalMult;
    }

    function currentCps() {
      return baseCps() * (Date.now() < buffUntil && buffName === "Frenzy" ? buffMult : 1);
    }

    function clickValue() {
      let v = (1 + baseCps() * effects.clickCpsPct) * effects.clickMult;
      if (Date.now() < buffUntil && buffName === "Click Frenzy") v *= buffMult;
      return v;
    }

    // Cost of buying `n` of a building starting from `have` owned (price grows 15% each).
    function costFor(b, have, n) {
      const r = 1.15;
      return Math.ceil(b.base * Math.pow(r, have) * (Math.pow(r, n) - 1) / (r - 1));
    }

    // ================= Formatting =================
    const SUFFIXES = ["", " thousand", " million", " billion", " trillion", " quadrillion", " quintillion", " sextillion"];

    function fmt(n, decimals = 0) {
      if (n < 1000) return n.toFixed(n < 10 && decimals ? decimals : 0).replace(/\.0$/, "");
      if (n < 1e6) return Math.floor(n).toLocaleString("en-US");
      const tier = Math.min(Math.floor(Math.log10(n) / 3), SUFFIXES.length - 1);
      return (n / Math.pow(1000, tier)).toFixed(3).replace(/\.?0+$/, "") + SUFFIXES[tier];
    }

    function fmtTime(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
    }

    // ================= Save / load =================
    function save() {
      state.lastSaved = Date.now();
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return;
        state = Object.assign(freshState(), JSON.parse(raw));
      } catch (e) { state = freshState(); }
    }

    // ================= Sound =================
    let audio;
    function beep(freq, duration = 0.08, type = "sine", volume = 0.1) {
      if (!soundOn) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audio.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.4, audio.currentTime + duration);
        gain.gain.setValueAtTime(volume, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + duration);
      } catch (e) { /* audio unavailable */ }
    }

    function chime() {
      [659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.15, "triangle", 0.12), i * 90));
    }

    // ================= Particles =================
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const fx = document.getElementById("fx");
    const ctx = fx.getContext("2d");
    let particles = [];

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      fx.width = innerWidth * dpr;
      fx.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener("resize", resize);
    resize();

    function crumbs(x, y, count, colors = ["#d99a4e", "#a8682b", "#4a2a12", "#f2c27b"]) {
      if (reduceMotion) count = Math.min(count, 4);
      if (particles.length > 400) return;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = Math.random() * 5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 3,
          size: Math.random() * 5 + 2,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
        });
      }
    }

    function drawParticles() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.vy += 0.25;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        ctx.globalAlpha = Math.max(p.life, 0);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function floatNum(text, x, y, color = "white") {
      const el = document.createElement("div");
      el.className = "float-num";
      el.textContent = text;
      el.style.left = x - 20 + Math.random() * 30 + "px";
      el.style.top = y - 30 + "px";
      el.style.color = color;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function toast(html) {
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = html;
      const box = document.getElementById("toasts");
      box.appendChild(el);
      while (box.children.length > 3) box.firstChild.remove();
      setTimeout(() => el.remove(), 3700);
    }

    // ================= UI =================
    const countEl = document.getElementById("count");
    const cpsEl = document.getElementById("cps");
    const buffEl = document.getElementById("buff");
    const buildingsEl = document.getElementById("buildings");
    const upgradesEl = document.getElementById("upgrades");
    const statsEl = document.getElementById("stats");
    const achEl = document.getElementById("achievements");
    const newsEl = document.getElementById("news");

    // Build building rows once, then just update text/disabled each frame.
    const buildingRows = {};
    for (const b of BUILDINGS) {
      const row = document.createElement("button");
      row.className = "building";
      row.innerHTML = `
        <div class="b-icon">${b.icon}</div>
        <div>
          <div class="b-name">${b.name}</div>
          <div class="b-info"></div>
          <div class="b-cost"></div>
        </div>
        <div class="b-owned">0</div>`;
      row.addEventListener("click", (e) => buyBuilding(b, e));
      buildingsEl.appendChild(row);
      buildingRows[b.id] = {
        row,
        info: row.querySelector(".b-info"),
        cost: row.querySelector(".b-cost"),
        owned: row.querySelector(".b-owned"),
      };
    }

    for (const a of ACHIEVEMENTS) {
      const el = document.createElement("div");
      el.className = "ach";
      el.dataset.id = a.id;
      el.textContent = a.icon;
      el.title = a.name + " — " + a.desc;
      achEl.appendChild(el);
    }

    let shownUpgradeIds = "";

    function renderUpgrades() {
      const available = UPGRADES.filter(u => !state.upgrades.includes(u.id) && u.unlock(state))
        .sort((a, b) => a.cost - b.cost);
      const ids = available.map(u => u.id).join(",");
      if (ids !== shownUpgradeIds) {
        shownUpgradeIds = ids;
        upgradesEl.innerHTML = "";
        for (const u of available) {
          const btn = document.createElement("button");
          btn.className = "upgrade";
          btn.dataset.id = u.id;
          btn.textContent = u.icon;
          btn.title = `${u.name} — ${u.desc} (Cost: ${fmt(u.cost)})`;
          btn.setAttribute("aria-label", btn.title);
          btn.addEventListener("click", () => buyUpgrade(u));
          upgradesEl.appendChild(btn);
        }
      }
      for (const btn of upgradesEl.children) {
        const u = UPGRADES.find(x => x.id === btn.dataset.id);
        btn.disabled = state.cookies < u.cost;
      }
    }

    function render() {
      countEl.textContent = fmt(Math.floor(state.cookies)) + (Math.floor(state.cookies) === 1 ? " cookie" : " cookies");
      cpsEl.textContent = "per second: " + fmt(cpsNow, 1);
      document.title = fmt(Math.floor(state.cookies)) + " cookies - Cookie Clicker";

      const buffActive = Date.now() < buffUntil;
      buffEl.style.display = buffActive ? "inline-block" : "none";
      if (buffActive) buffEl.textContent = `${buffName} x${buffMult}! ${Math.ceil((buffUntil - Date.now()) / 1000)}s`;

      let prevOwned = true;
      for (const b of BUILDINGS) {
        const r = buildingRows[b.id];
        const have = owned(state, b.id);
        const cost = costFor(b, have, buyAmount);
        // Show a building once you own the previous one (or it's affordable-ish).
        const visible = prevOwned || state.totalBaked >= b.base * 0.5;
        r.row.style.display = visible ? "" : "none";
        const locked = have === 0 && state.totalBaked < b.base;
        r.row.classList.toggle("locked", locked);
        r.row.disabled = state.cookies < cost;
        r.cost.textContent = "🍪 " + fmt(cost) + (buyAmount > 1 ? ` (x${buyAmount})` : "");
        r.owned.textContent = have;
        const each = b.cps * effects.mult[b.id] * effects.globalMult;
        r.info.textContent = locked ? "???" : `${b.desc} Each makes ${fmt(each, 1)}/s.`;
        r.row.title = `${b.name}: ${fmt(buildingCps(b) * effects.globalMult, 1)}/s total`;
        prevOwned = have > 0;
      }

      renderUpgrades();

      const totalBuildings = BUILDINGS.reduce((s, b) => s + owned(state, b.id), 0);
      statsEl.innerHTML = `
        <span>Cookies baked (all time)</span><span>${fmt(Math.floor(state.totalBaked))}</span>
        <span>Cookie clicks</span><span>${fmt(state.totalClicks)}</span>
        <span>Cookies per click</span><span>${fmt(clickValue(), 1)}</span>
        <span>Buildings owned</span><span>${fmt(totalBuildings)}</span>
        <span>Upgrades bought</span><span>${state.upgrades.length} / ${UPGRADES.length}</span>
        <span>Golden cookies clicked</span><span>${state.goldenClicks}</span>
        <span>Achievements</span><span>${state.achievements.length} / ${ACHIEVEMENTS.length}</span>
        <span>Time played</span><span>${fmtTime(Date.now() - state.startedAt)}</span>`;
    }

    // ================= Actions =================
    function earn(n) {
      state.cookies += n;
      state.totalBaked += n;
    }

    const cookieBtn = document.getElementById("cookie");
    cookieBtn.addEventListener("click", (e) => {
      const v = clickValue();
      earn(v);
      state.totalClicks++;
      const rect = cookieBtn.getBoundingClientRect();
      const x = e.clientX || rect.left + rect.width / 2;
      const y = e.clientY || rect.top + rect.height / 2;
      floatNum("+" + fmt(v, 1), x, y);
      crumbs(x, y, 8);
      beep(420 + Math.random() * 80, 0.06, "sine", 0.08);
      if (navigator.vibrate) navigator.vibrate(8);
    });

    function buyBuilding(b, e) {
      const have = owned(state, b.id);
      const cost = costFor(b, have, buyAmount);
      if (state.cookies < cost) return;
      state.cookies -= cost;
      state.buildings[b.id] = have + buyAmount;
      beep(600, 0.1, "triangle", 0.1);
      if (e && e.clientX) crumbs(e.clientX, e.clientY, 10, ["#ffcc4d", "#ff8a3d", "#fff6ec"]);
      if (have === 0) toast(`${b.icon} <b>${b.name}</b> unlocked! ${b.desc}`);
    }

    function buyUpgrade(u) {
      if (state.cookies < u.cost || state.upgrades.includes(u.id)) return;
      state.cookies -= u.cost;
      state.upgrades.push(u.id);
      computeEffects();
      chime();
      toast(`${u.icon} <b>${u.name}</b> — ${u.desc}`);
    }

    document.getElementById("buyAmount").addEventListener("click", (e) => {
      const n = e.target.dataset && e.target.dataset.n;
      if (!n) return;
      buyAmount = Number(n);
      for (const btn of e.currentTarget.children) btn.classList.toggle("active", btn === e.target);
    });

    document.getElementById("soundToggle").addEventListener("click", (e) => {
      soundOn = !soundOn;
      e.currentTarget.textContent = soundOn ? "🔊 Sound" : "🔇 Muted";
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      if (!confirm("Reset your bakery? All cookies, buildings and upgrades will be lost.")) return;
      state = freshState();
      computeEffects();
      buffUntil = 0;
      shownUpgradeIds = "";
      for (const el of achEl.children) el.classList.remove("got");
      save();
      toast("🗑️ Bakery reset. Time to start baking again!");
    });

    // ================= Golden cookie =================
    const golden = document.getElementById("golden");
    let nextGolden = Date.now() + randomGoldenDelay();
    let goldenHideTimer;

    function randomGoldenDelay() {
      const rate = effects ? effects.goldenRate : 1;
      return (60000 + Math.random() * 120000) / rate;  // 1-3 minutes
    }

    function spawnGolden() {
      golden.style.left = Math.random() * (innerWidth - 90) + 10 + "px";
      golden.style.top = Math.random() * (innerHeight - 90) + 10 + "px";
      golden.style.display = "block";
      golden.style.animation = "none";
      void golden.offsetWidth;
      golden.style.animation = "";
      clearTimeout(goldenHideTimer);
      goldenHideTimer = setTimeout(() => (golden.style.display = "none"), 12000);
    }

    golden.addEventListener("click", (e) => {
      golden.style.display = "none";
      state.goldenClicks++;
      const roll = Math.random();
      if (roll < 0.45) {
        buffName = "Frenzy"; buffMult = 7; buffUntil = Date.now() + 30000;
        toast("✨ <b>Frenzy!</b> Cookie production x7 for 30 seconds!");
      } else if (roll < 0.6) {
        buffName = "Click Frenzy"; buffMult = 77; buffUntil = Date.now() + 13000;
        toast("✨ <b>Click Frenzy!</b> Clicks are x77 for 13 seconds!");
      } else {
        const gain = Math.max(13, Math.min(state.cookies * 0.15, baseCps() * 900));
        earn(gain);
        toast(`✨ <b>Lucky!</b> +${fmt(gain)} cookies!`);
      }
      crumbs(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, 40, ["#ffcc4d", "#fff3b0", "#e09b1a"]);
      chime();
    });

    // ================= Main loop =================
    let lastTick = performance.now();
    let lastSave = Date.now();
    let lastNews = 0;

    function checkAchievements() {
      for (const a of ACHIEVEMENTS) {
        if (!state.achievements.includes(a.id) && a.test(state)) {
          state.achievements.push(a.id);
          toast(`🏆 Achievement unlocked: <b>${a.name}</b><br><small>${a.desc}</small>`);
          chime();
        }
      }
      for (const el of achEl.children) el.classList.toggle("got", state.achievements.includes(el.dataset.id));
    }

    function frame(now) {
      const dt = Math.min((now - lastTick) / 1000, 1);
      lastTick = now;

      cpsNow = currentCps();
      earn(cpsNow * dt);

      if (Date.now() > nextGolden) {
        spawnGolden();
        nextGolden = Date.now() + randomGoldenDelay();
      }

      drawParticles();
      requestAnimationFrame(frame);
    }

    // Slower UI/bookkeeping tick (keeps the page light on phones)
    setInterval(() => {
      render();
      checkAchievements();
      if (Date.now() - lastSave > 5000) { save(); lastSave = Date.now(); }
      if (Date.now() - lastNews > 12000) {
        lastNews = Date.now();
        newsEl.textContent = NEWS[Math.floor(Math.random() * NEWS.length)];
      }
    }, 100);

    // Catch up when returning to a background tab, and save when leaving.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) save();
    });
    addEventListener("pagehide", save);

    // ================= Start =================
    load();
    computeEffects();

    // Offline earnings: half speed while away, up to 2 hours.
    const away = Math.min((Date.now() - state.lastSaved) / 1000, 7200);
    if (away > 10 && baseCps() > 0) {
      const offline = baseCps() * away * 0.5;
      earn(offline);
      setTimeout(() => toast(`👋 Welcome back! Your bakery made <b>${fmt(offline)}</b> cookies while you were away.`), 400);
    }

    render();
    checkAchievements();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
